[project]
name = "statbelt"
version = "0.1.4"
description = "A strict experimental harness for reproducible, statistically valid model evaluation."
readme = "README.md"
authors = [
    { name = "TheDarkchip", email = "robin.gieseke@me.com" }
]
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["machine-learning", "evaluation", "reproducibility", "statistics"]
dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/TheDarkchip/statbelt"
Repository = "https://github.com/TheDarkchip/statbelt"
Issues = "https://github.com/TheDarkchip/statbelt/issues"
Documentation = "https://github.com/TheDarkchip/statbelt#readme"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.148.2",
    "pytest>=9.0.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
addopts = "--cov=statbelt --cov-report=term-missing"
