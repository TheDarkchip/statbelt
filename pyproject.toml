[project]
name = "statbelt"
version = "0.1.0"
description = "A strict experimental harness for reproducible, statistically valid model evaluation."
readme = "README.md"
authors = [
    { name = "TheDarkchip", email = "robin.gieseke@me.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
]

[project.scripts]
statbelt = "statbelt:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
addopts = "--cov=statbelt --cov-report=term-missing"
